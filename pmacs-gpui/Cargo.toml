[package]
name = "pmacs-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

# The workbench trial builds independently of the shipped release pair.
[workspace]

[dependencies]
pmacs-attach-client = { path = "../pmacs-attach-client" }
# GPUI's async-tar uses xattr 0.2, which still imports Linux's libc::ENOATTR.
libc = "=0.2.189"
async-channel = "2"
gpui = "=0.2.2"
loro = "=1.12.0"
ropey = { version = "1.6", default-features = false }
pmacs-protocol = { path = "../pmacs-protocol" }
unicode-segmentation = "1"

[lints.rust]
unsafe_code = "forbid"
