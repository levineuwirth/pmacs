name: Grammar fuzz

# E7g. Every bundled tree-sitter grammar is C beside a Rust editor that
# forbids `unsafe`, and in daemon mode one bad parse takes every buffer
# the daemon holds. E7e shipped tree-sitter-haskell 0.23.1 because its
# author's test file parsed; the owner's real file, two
# `{-# LANGUAGE #-}` pragmas, aborted the editor. So a grammar's fuzz run
# is a condition of shipping it, and this job runs one whenever the
# grammar set can have changed: the crate graph (Cargo.lock, Cargo.toml),
# the table (src/syntax.rs), the corpora (fuzz/), or the harness.
#
# `scripts/fuzz-grammars` builds the harness under the `fuzz` profile, so
# the C is optimized as it ships (the Haskell overflow is a miscompile at
# -O2 that a debug build never shows), with the tree-sitter runtime and
# grammar C under AddressSanitizer; seeds every grammar from this tree and
# its upstream sources at the commits fuzz/corpora.tsv pins; and fails on
# a crash or a parse that never returns (a slow or large one is reported,
# D36). The PR smoke is every upstream corpus example and at most 100
# seeds per grammar from each other source, each cut to 16 KB, then at
# least 300 mutations and 15 s per grammar (four minutes at most); the
# grammars a pull request changed --- a crate's locked version, its
# corpora row, its vendored copy, from `pmacs_grammar_fuzz changed` ---
# run ten minutes instead, and a tree-sitter runtime bump runs them all
# ten minutes. `workflow_dispatch` runs the long form, 400 seeds a source
# and ten minutes a grammar by default.
#
# What this job can and cannot catch (E7h.4; CLAUDE.md states it beside
# the rule): it builds the grammars as they ship, -fno-strict-aliasing
# included, with ASan and UBSan on their C, so a memory error or UB on a
# path an input reaches is reported where it happens, on any compiler;
# every parse runs under the hang limit as its deadline, so a parse that
# never returns is a hang however it grows; the mutator nests past the
# depths at which a scanner's state outgrows tree-sitter's buffer. It
# cannot reach an input its mutator does not (it is not coverage-guided),
# it sees GCC 13 and not the laptop's GCC 16, and its green is not a
# proof: a short run found no defect, nothing more. The owner makes it a
# required check; a session cannot.

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - .cargo/config.toml
      - src/syntax.rs
      - src/bin/pmacs_grammar_fuzz.rs
      - scripts/fuzz-grammars
      - fuzz/**
      - vendor/**
      - builtin/queries/**
      - .github/workflows/grammar-fuzz.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - .cargo/config.toml
      - src/syntax.rs
      - src/bin/pmacs_grammar_fuzz.rs
      - scripts/fuzz-grammars
      - fuzz/**
      - vendor/**
      - builtin/queries/**
      - .github/workflows/grammar-fuzz.yml
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of mutation per grammar, after its seeds
        default: "600"
      jobs:
        description: Grammars fuzzed at a time
        default: "4"
      max_files:
        description: Seeds per grammar from each source
        default: "400"
      min_mutations:
        description: Mutated inputs per grammar at least (under four minutes, or the seconds if longer)
        default: "300"

concurrency:
  group: grammar-fuzz-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Grammar fuzz (every grammar, ASan)
    runs-on: ubuntu-latest
    # The smoke: a cold -O3 build of the workspace's dependencies (about
    # ten minutes), the upstream fetch, the capped seeds, then per grammar
    # 300 mutations or four minutes, four at a time; the grammars a change
    # touched run ten minutes. The long form: 20 grammars at 600 s, four
    # at a time, is under an hour of mutation.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 300 || 120 }}
    env:
      PMACS_FUZZ_DIR: ${{ github.workspace }}/target/grammar-fuzz
    steps:
      - uses: actions/checkout@v4
        with:
          # `changed --since` reads the base's Cargo.lock and corpora.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/grammar-fuzz/target"
      - name: Fuzz every grammar
        run: >-
          scripts/fuzz-grammars
          --arm ubsan
          --seconds "${{ inputs.seconds || '15' }}"
          --jobs "${{ inputs.jobs || '4' }}"
          --max-files "${{ inputs.max_files || '100' }}"
          --max-seed-kb "${{ github.event_name == 'workflow_dispatch' && '64' || '16' }}"
          --min-mutations "${{ inputs.min_mutations || '300' }}"
          --max-seconds 240
          ${{ github.event_name == 'pull_request' && format('--long-since {0}', github.event.pull_request.base.sha) || '' }}
          ${{ github.event_name == 'push' && format('--long-since {0}', github.event.before) || '' }}
          --out "${{ github.workspace }}/grammar-fuzz-report"
      - name: Keep the report and every reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-fuzz-report
          path: grammar-fuzz-report
          if-no-files-found: warn
