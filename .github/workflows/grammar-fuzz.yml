name: Grammar fuzz

# E7g. Every bundled tree-sitter grammar is C beside a Rust editor that
# forbids `unsafe`, and in daemon mode one bad parse takes every buffer
# the daemon holds. E7e shipped tree-sitter-haskell 0.23.1 because its
# author's test file parsed; the owner's real file, two
# `{-# LANGUAGE #-}` pragmas, aborted the editor. So a grammar's fuzz run
# is a condition of shipping it, and this job runs one whenever the
# grammar set can have changed: the crate graph (Cargo.lock, Cargo.toml),
# the C flags (.cargo/config.toml), the table (src/syntax.rs), the query
# overlays (builtin/queries/), the vendored grammars (vendor/), the
# corpora (fuzz/), or the harness.
#
# The workflow runs on every pull request and every push to main, and its
# first step asks `scripts/grammar-fuzz-needed` whether the change touched
# any of those (E7h fix round 1). Until then a workflow-level `paths:`
# filter decided, and a workflow a filter skips reports no check at all,
# so the job could not be made required: a required check that never
# reports blocks a merge forever. Now the job always reports, success when
# nothing it fuzzes changed, and the path list is the script's, which
# tests/e7g_grammar_fuzz_acceptance.rs exercises.
#
# `scripts/fuzz-grammars` builds the harness under the `fuzz` profile, so
# the C is optimized as it ships (the Haskell overflow was UB GCC 16
# exploits at -O2 that a debug build never shows), once per leg of the
# matrix: `ubsan`, the tree-sitter runtime and grammar C under
# AddressSanitizer and UndefinedBehaviorSanitizer with the config's
# -fno-strict-aliasing, as it ships; and since E7h's fix round 2
# `asan-strict`, AddressSanitizer alone with strict aliasing restored after
# that flag, the one leg that lets a compiler turn aliasing UB into the
# memory error ASan reports (E7h review 2: GCC 13.3 forwards a stored length
# through a narrower lvalue under it). The `ubsan` leg keeps the job's name,
# `Grammar fuzz`. The script's third arm, TypeSanitizer, runs in the rule's
# laptop run and not here (CLAUDE.md). It seeds every grammar from this tree
# and its upstream sources at the commits fuzz/corpora.tsv pins, and fails on
# a crash, a parse that never returns or one cut at the memory cap, unless
# fuzz/accepted.tsv names the finding (a slow or large one is reported,
# D36). The PR smoke is every
# upstream corpus example and at most 100 seeds per grammar from each other
# source, each cut to 16 KB, then at least 300 mutations and 15 s per
# grammar (four minutes at most); the grammars a pull request changed --- a
# crate's locked version, its corpora row, its vendored copy, from
# `pmacs_grammar_fuzz changed` --- run ten minutes instead, and a
# tree-sitter runtime bump runs them all ten minutes. `workflow_dispatch`
# runs the long form, 400 seeds a source and ten minutes a grammar by
# default.
#
# What this job can and cannot catch is stated beside the rule in
# CLAUDE.md, and is not repeated here so that the two cannot drift. The
# owner makes it a required check; a session cannot.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of mutation per grammar, after its seeds
        default: "600"
      jobs:
        description: Grammars fuzzed at a time
        default: "4"
      max_files:
        description: Seeds per grammar from each source
        default: "400"
      min_mutations:
        description: Mutated inputs per grammar at least (under four minutes, or the seconds if longer)
        default: "300"

concurrency:
  group: grammar-fuzz-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: ${{ matrix.arm == 'ubsan' && 'Grammar fuzz' || format('Grammar fuzz ({0})', matrix.arm) }}
    strategy:
      fail-fast: false
      matrix:
        arm: [ubsan, asan-strict]
    # Pinned, not `ubuntu-latest`: the image decides the compiler, and
    # CLAUDE.md says which compiler this job is (GCC 13 on 24.04); the
    # first fuzzing step prints it (E7h review 2, Low 8).
    runs-on: ubuntu-24.04
    # The smoke: a cold -O3 build of the workspace's dependencies (about
    # ten minutes), the upstream fetch, the capped seeds, then per grammar
    # 300 mutations or four minutes, four at a time; the grammars a change
    # touched run ten minutes. The long form: 20 grammars at 600 s, four
    # at a time, is under an hour of mutation. Each leg is its own runner,
    # so the second arm adds runner minutes, not wall clock.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 300 || 120 }}
    env:
      PMACS_FUZZ_DIR: ${{ github.workspace }}/target/grammar-fuzz
    steps:
      - uses: actions/checkout@v4
        with:
          # `changed --since` and the decision read the base's history.
          fetch-depth: 0
      - name: Decide whether the grammar set changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch) printf 'run=true\nreason=dispatched\n' > decision ;;
            pull_request) scripts/grammar-fuzz-needed --base "$PR_BASE" > decision ;;
            push) scripts/grammar-fuzz-needed --base "$PUSH_BEFORE" > decision ;;
            *) printf 'run=true\nreason=event %s\n' "$EVENT" > decision ;;
          esac
          cat decision
          cat decision >> "$GITHUB_OUTPUT"
      - name: Nothing this job fuzzes changed
        if: steps.decide.outputs.run != 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "Grammar fuzz passes without fuzzing: $REASON"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.decide.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.decide.outputs.run == 'true'
        with:
          # One cache a leg: the arms build into their own directories.
          key: ${{ matrix.arm }}
          workspaces: ". -> target/grammar-fuzz/${{ matrix.arm == 'ubsan' && 'target' || format('target-{0}', matrix.arm) }}"
          # Only `main` saves, as in ci.yml (its note above `jobs:`): a
          # pull request's entry is readable by that pull request alone.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Name the runner image and the compiler
        if: steps.decide.outputs.run == 'true'
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          cc --version | head -n 1
          gcc -print-file-name=libasan.so
      - name: Fuzz every grammar
        if: steps.decide.outputs.run == 'true'
        run: >-
          scripts/fuzz-grammars
          --arm "${{ matrix.arm }}"
          --seconds "${{ inputs.seconds || '15' }}"
          --jobs "${{ inputs.jobs || '4' }}"
          --max-files "${{ inputs.max_files || '100' }}"
          --max-seed-kb "${{ github.event_name == 'workflow_dispatch' && '64' || '16' }}"
          --min-mutations "${{ inputs.min_mutations || '300' }}"
          --max-seconds 240
          ${{ github.event_name == 'pull_request' && format('--long-since {0}', github.event.pull_request.base.sha) || '' }}
          ${{ github.event_name == 'push' && format('--long-since {0}', github.event.before) || '' }}
          --out "${{ github.workspace }}/grammar-fuzz-report"
      - name: Keep the report and every reproduction
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arm == 'ubsan' && 'grammar-fuzz-report' || format('grammar-fuzz-report-{0}', matrix.arm) }}
          path: grammar-fuzz-report
          if-no-files-found: warn
