# E7h.1: every C source the build compiles --- the tree-sitter runtime and
# every bundled grammar --- is compiled with -fno-strict-aliasing.
#
# Grammars generated by tree-sitter's CLI before 0.24 vendor a
# `tree_sitter/array.h` whose `array_push` writes the array's `contents`
# through an `(Array *)` cast and reads it back through the real element
# pointer: undefined behavior under C's aliasing rule. GCC 16 at -O2 and
# -O3 compiled it into tree-sitter-haskell 0.23.1's heap overflow (E7g);
# bash and python ship the same header and execute the same UB on every
# push, and whether a compiler turns it into a crash is that compiler's
# choice. The flag takes the choice away from every compiler. It does not
# make the source conforming: clang's type sanitizer still reports it (E7g
# review 1, E7h.1), and only a fixed header silences that.
#
# The `cc` crate reads `CFLAGS`, then `HOST_CFLAGS` (a native build) or
# `TARGET_CFLAGS` (a cross build), then `CFLAGS_<target>`, and
# concatenates them, so a user's own `CFLAGS` still applies beside these.
# `force` keeps an inherited `HOST_CFLAGS`/`TARGET_CFLAGS` from silently
# dropping the flag; `tests/e7h_grammar_gate_acceptance.rs` holds this
# file to it and reads every grammar's build record for it.
[env]
HOST_CFLAGS = { value = "-fno-strict-aliasing", force = true }
TARGET_CFLAGS = { value = "-fno-strict-aliasing", force = true }
