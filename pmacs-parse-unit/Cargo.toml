[package]
name = "pmacs-parse-unit"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "pmacs's parse unit: one buffer's parse and every read of its tree, in a worker process"
license = "MIT OR Apache-2.0"
authors = ["Pmacs contributors"]
readme = "../README.md"
repository = "https://git.levineuwirth.org/neuwirth/pmacs"
homepage = "https://levineuwirth.org/essays/pmacs"
keywords = ["editor", "emacs", "tree-sitter", "isolation"]
categories = ["text-editors", "parsing"]
publish = false

# E7i: the worker process the editor spawns per buffer (`main.rs`
# applies the memory limit to itself). It reads requests on stdin and
# answers on stdout.
[dependencies]
pmacs-syntax = { path = "../pmacs-syntax" }
tree-sitter = "0.26"
serde = { workspace = true }
postcard = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["resource"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allows: the root `pmacs` crate's set, mirrored.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
multiple_crate_versions = "allow"
